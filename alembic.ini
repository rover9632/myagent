# Alembic configuration. Run migrations from the repo root:
#   uv run alembic upgrade head
# sqlalchemy.url is intentionally empty -- alembic/env.py builds it from
# app.config.get_settings().pg_uri (which reads .env from the CWD).
# No [loggers]/[handlers]/[formatters] sections on purpose: env.py does not
# call fileConfig(), so alembic never reconfigures the application's logging.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
